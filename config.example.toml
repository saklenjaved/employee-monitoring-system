# Example configuration for the Windows agent. Copy to config.toml and edit.
# Contains no real secrets. The registration code below is a LOCAL TEST code for the mock backend only.

[api]
# Must be https://. The local mock uses a self-signed certificate: point ca_bundle at it (verification stays on).
base_url = "https://127.0.0.1:8443/api/agent/v1"
timeout_seconds = 10
ca_bundle = "monitoring-platform/certs/cert.pem"

[registration]
# Local test code accepted by mock_backend/server.py. Not for production.
code = "DEMO-LOCAL-0001"

[monitoring]
sample_interval_seconds = 30     # default, to confirm: 30 s (allowed 5..300)
idle_threshold_seconds = 300     # default, to confirm: 300 s (allowed 60..3600)
sync_interval_seconds = 15
heartbeat_interval_seconds = 60
policy_refresh_seconds = 300
batch_size = 500
queue_max_events = 10000         # bounded SQLite offline queue (encrypted)
queue_max_age_hours = 72
capture_window_title = true      # window titles on, with the exclusions below
excluded_apps = ["KeePass.exe", "KeePassXC.exe", "1Password.exe", "Bitwarden.exe"]
title_keywords_excluded = ["password", "incognito", "inprivate", "private browsing"]

[screenshots]
enabled = false                  # OFF by default. The mock policy must also enable it (mock_backend/demo_policy.json)
interval_seconds = 600           # default, to confirm: every 10 minutes

[paths]
data_dir = "demo_data"           # local data: credential, offline queue, logs, health
