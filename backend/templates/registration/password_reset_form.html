{% extends "base.html" %}
{% block title %}Reset password{% endblock %}
{% block content %}
<div class="card">
  <h1>Reset your password</h1>
  <p class="muted">Enter your account email. If an account exists, we send a link to choose a new password.</p>
  <form method="post">
    {% csrf_token %}
    {% include "includes/_form_fields.html" %}
    <div class="actions">
      <button type="submit">Send reset link</button>
    </div>
  </form>
  <p class="help"><a href="{% url 'login' %}">Back to log in</a></p>
</div>
{% endblock %}
