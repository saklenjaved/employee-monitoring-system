# Local development services only. The values below are development defaults,
# not production secrets. Override them with a .env file next to this file
# (see .env.example).
#
# The screenshot storage stand-in is not here: MinIO's public images are no longer available.
# Use scripts/dev_s3.py instead (see README.md).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: employee_monitoring
      POSTGRES_USER: monitoring
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
    ports:
      # Host port 5433 so it does not clash with a PostgreSQL already installed on 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
