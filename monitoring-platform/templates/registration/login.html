{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card">
  <h1>Log in</h1>
  <p class="muted">Sign in with the work email your administrator gave you.</p>
  <form method="post" id="login-form" data-password-toggle>
    {% csrf_token %}
    {% include "includes/_form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="actions">
      <button type="submit" id="login-submit">Log in</button>
    </div>
  </form>
  <p class="help"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
</div>
<script>
  // Stop a double submit and show that the sign-in is in progress.
  document.getElementById("login-form").addEventListener("submit", function () {
    var button = document.getElementById("login-submit");
    button.disabled = true;
    button.textContent = "Signing in…";
  });
</script>
{% endblock %}
